name: NCBI Bio-Station CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-and-hygiene:
    name: Backend Lint & Hygiene Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test & lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest fastapi httpx pydantic psutil biopython python-multipart python-docx matplotlib requests scipy networkx

      - name: Ruff static check (src/ + tests/ + tracked scripts/**/*.py)
        run: |
          ruff check src tests
          mapfile -t tracked_scripts < <(git ls-files 'scripts/*.py' 'scripts/**/*.py')
          if [ "${#tracked_scripts[@]}" -gt 0 ]; then
            ruff check "${tracked_scripts[@]}"
          fi

      - name: Pyright progressive type check (routes & services)
        run: pyright -p pyrightconfig.ci.json

      - name: Core hygiene, security & offline regression suites
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
        run: python -m pytest -m offline -q

  frontend-and-electron:
    name: Frontend Vitest, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web-next/package-lock.json

      - name: Check Electron syntax & version sync
        run: |
          node --check electron-shell/main.js
          node --check electron-shell/preload.js
          node --check electron-shell/dev-runner.js
          node --check electron-shell/electron-builder.config.js
          node scripts/sync_version.mjs --check

      - name: Install frontend dependencies
        working-directory: src/web-next
        run: npm ci

      - name: Run Electron ESLint check
        working-directory: src/web-next
        run: npm run lint:electron

      - name: Run frontend ESLint check
        working-directory: src/web-next
        run: npm run lint

      - name: Run Vitest suite
        working-directory: src/web-next
        run: npm run test -- --run

      - name: Run vue-tsc and Vite build
        working-directory: src/web-next
        run: npm run build
