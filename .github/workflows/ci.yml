name: NCBI Bio-Station CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-and-hygiene:
    name: Backend Lint & Hygiene Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test & lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest fastapi httpx pydantic psutil biopython python-multipart

      - name: Ruff static check
        run: ruff check src

      - name: Core hygiene & security guard tests
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
        run: python -m pytest tests/test_repo_hygiene.py tests/test_security_and_lan_guard.py tests/test_resource_guard_and_hygiene_p2.py -q

  frontend-and-electron:
    name: Frontend Vitest, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web-next/package-lock.json

      - name: Check Electron main, preload & dev-runner syntax
        run: |
          node --check electron-shell/main.js
          node --check electron-shell/preload.js
          node --check electron-shell/dev-runner.js

      - name: Install frontend dependencies
        working-directory: src/web-next
        run: npm ci

      - name: Run Vitest suite
        working-directory: src/web-next
        run: npm run test -- --run

      - name: Run vue-tsc and Vite build
        working-directory: src/web-next
        run: npm run build
