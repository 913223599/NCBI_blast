name: NCBI Bio-Station CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-and-hygiene:
    name: Backend Lint & Hygiene Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test & lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest fastapi httpx pydantic psutil biopython python-multipart python-docx matplotlib

      - name: Ruff static check (src/ + tracked scripts/*.py)
        run: |
          ruff check src
          mapfile -t tracked_scripts < <(git ls-files 'scripts/*.py')
          if [ "${#tracked_scripts[@]}" -gt 0 ]; then
            ruff check "${tracked_scripts[@]}"
          fi

      - name: Core hygiene, security & offline regression suites
        env:
          PYTHONPATH: "."
          PYTHONUTF8: "1"
        run: >
          python -m pytest
          tests/test_repo_hygiene.py
          tests/test_security_and_lan_guard.py
          tests/test_resource_guard_and_hygiene_p2.py
          tests/test_archive_guard.py
          tests/test_core_layer_and_task_db.py
          tests/test_other_tools_api.py
          tests/test_publication_renderer_layouts.py
          tests/test_phage_discovery_split_imports.py
          tests/test_phase7_structure_3d_and_docx_citations.py
          -q

  frontend-and-electron:
    name: Frontend Vitest, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web-next/package-lock.json

      - name: Check Electron main, preload & dev-runner syntax
        run: |
          node --check electron-shell/main.js
          node --check electron-shell/preload.js
          node --check electron-shell/dev-runner.js

      - name: Install frontend dependencies
        working-directory: src/web-next
        run: npm ci

      - name: Run Vitest suite
        working-directory: src/web-next
        run: npm run test -- --run

      - name: Run vue-tsc and Vite build
        working-directory: src/web-next
        run: npm run build
