<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Node Studio | Workflow Architect</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap">

    <!-- Tree Engine Integration -->
    <link rel="stylesheet" href="../css/tree_explorer.css">
    <script src="../static/js/tree_engine.js"></script>
    <link rel="stylesheet" href="../css/node_studio.css">

    <!-- UI Utilities (Shared across views) -->
    <script src="../js/ui_utils.js"></script>
    <script src="../js/i18n_service.js"></script>
    <script src="../js/ui_controller.js"></script>

    <!-- Core Modules (Lazy loaded at bottom) -->
    <script src="../js/viewport_controller.js"></script>
    <script src="../js/wire_controller.js"></script>
    <script src="../js/node_controller.js"></script>
    <script src="../js/studio_bridge.js"></script>
    <script src="../js/studio_app.js"></script>
</head>

<body>

    <aside class="sidebar">
        <div class="sidebar-tabs">
            <button class="sidebar-tab active" id="tab-nodes" onclick="switchSidebarTab('nodes')"
                data-i18n="ui.tab.nodes">Tool Nodes</button>
            <button class="sidebar-tab" id="tab-templates" onclick="switchSidebarTab('templates')"
                data-i18n="ui.tab.templates">Templates</button>
        </div>

        <div class="sidebar-panel active" id="nodes-panel">
            <input class="search-box" placeholder="🔍 Search tools... (拼音/EN)" oninput="filterNodes(this.value)"
                data-i18n-placeholder="ui.search.placeholder">
            <div class="library-scroll" id="sidebar-library">
                <!-- Tool categories will be populated dynamically from bridge metadata -->
            </div>
        </div>

        <div class="sidebar-panel" id="templates-panel">
            <input class="search-box" placeholder="🔍 Search templates..." oninput="filterTemplates(this.value)"
                data-i18n-placeholder="ui.search.template_placeholder">
            <button class="btn-save-template" onclick="saveCurrentAsTemplate()">
                + Save Current as Template
            </button>
            <div class="library-scroll" id="template-list">
                <!-- Templates populated dynamically -->
            </div>
        </div>
    </aside>

    <!-- Floating Toolbar -->
    <div class="studio-toolbar" id="studio-toolbar">
        <!-- 执行组 -->
        <div class="toolbar-group">
            <button class="toolbar-btn toolbar-btn--primary" onclick="runWorkflow()" title="运行工作流 (Ctrl+Enter)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <span data-i18n="ui.toolbar.run">Run</span>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 编辑组 -->
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="undoManager.undo()" title="撤销 (Ctrl+Z)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10" />
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
            </button>
            <button class="toolbar-btn" onclick="undoManager.redo()" title="重做 (Ctrl+Shift+Z)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10" />
                    <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10" />
                </svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 布局组 -->
        <div class="toolbar-group">
            <button class="toolbar-btn" onclick="nodeCtrl.autoArrangeNodes()" title="自动排列节点">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7" />
                    <rect x="14" y="3" width="7" height="7" />
                    <rect x="3" y="14" width="7" height="7" />
                    <rect x="14" y="14" width="7" height="7" />
                </svg>
            </button>
            <button class="toolbar-btn" onclick="viewportCtrl.resetViewport()" title="居中视口">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <circle cx="12" cy="12" r="8" />
                    <line x1="12" y1="1" x2="12" y2="4" />
                    <line x1="12" y1="20" x2="12" y2="23" />
                    <line x1="1" y1="12" x2="4" y2="12" />
                    <line x1="20" y1="12" x2="23" y2="12" />
                </svg>
            </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- 危险操作组 -->
        <div class="toolbar-group">
            <button class="toolbar-btn toolbar-btn--danger" onclick="clearCanvas()" title="清空画布">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    <line x1="10" y1="11" x2="10" y2="17" />
                    <line x1="14" y1="11" x2="14" y2="17" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Viewport Status (bottom-right) -->
    <div class="viewport-status" id="viewport-stats"></div>

    <div id="toast-container"></div>

    <!-- Canvas -->
    <div id="studio-container">
        <div id="canvas-root">
            <svg id="connections-layer" width="100%" height="100%"
                style="position:absolute; top:0; left:0; z-index:5; pointer-events:none; overflow:visible;">
            </svg>

            <!-- Nodes will be added dynamically -->
        </div>
    </div>

    <!-- Phase 5 Core Framework -->
    <script src="../dist/js/qwebchannel.js"></script>
    <script src="../js/undo_manager.js"></script>
    <script src="../js/link_system.js"></script>
    <script src="../js/node_factory.js"></script>
    <script src="../js/graph_model.js"></script>
    <script src="../js/topology_manager.js"></script>
    <script src="../js/template_manager.js"></script>
    <script src="../static/js/tooltip_fix.js"></script>

    <script>
        /**
         * Node Studio - Bootstrapper
         */
        console.log('[Studio] Bootstrapping Application...');
        const app = new StudioApp();

        // 兼容现有的全局变量引用（逐步重写为直接调用 app.xxx）
        const i18n = app.i18n;
        const undoManager = app.undoManager;
        const linkSystem = app.linkSystem;
        const viewportCtrl = app.viewportCtrl;
        const nodeCtrl = app.nodeCtrl;
        const topologyManager = app.topologyManager;

        // 全局跳转函数 (保持 onclick 兼容性)
        window.runWorkflow = () => app.bridge.runWorkflow();
        window.requestNodeFile = (id, type) => app.bridge.requestNodeFile(id, type);
        window.handleFileLoaded = (data) => app.bridge.handleFileLoaded(data);
        window.clearCanvas = () => app.showClearConfirm(); // 将在 Phase 5 完善

        // 侧边栏辅助
        function switchSidebarTab(tab) {
            document.querySelectorAll('.sidebar-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sidebar-panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`${tab}-panel`).classList.add('active');
        }

        function filterNodes(query) {
            const normalizedQuery = query.toLowerCase();
            document.querySelectorAll('.library-item').forEach(item => {
                const combined = (item.dataset.id + ' ' + item.dataset.name + ' ' + (item.innerText || '')).toLowerCase();
                item.style.display = combined.includes(normalizedQuery) ? 'flex' : 'none';
            });
            document.querySelectorAll('.category-group').forEach(cat => {
                const hasVisible = Array.from(cat.querySelectorAll('.library-item')).some(i => i.style.display === 'flex');
                cat.style.display = hasVisible ? 'block' : 'none';
                if (hasVisible) cat.classList.remove('collapsed');
            });
        }

        function saveCurrentAsTemplate() {
            if (!app.bridge.templateManager) return;
            const name = prompt(app.i18n.t('ui.prompt.template_name') || 'Enter template name:',
                app.i18n.t('ui.template.new_workflow') || 'New Workflow');
            if (name) {
                app.bridge.templateManager.saveCurrent(name);
                app.showToast(app.i18n.t('ui.msg.template_saved') || 'Saved');
            }
        }

        function filterTemplates(query) {
            if (app.bridge.templateManager) app.bridge.templateManager.renderTemplates(query);
        }

        // 启动系统
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>

</html>
