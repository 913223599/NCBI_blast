<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>iCn3D Viewer Wrapper</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            /* Darker to match viewer */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        #debug-log {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 350px;
            max-height: 200px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            border-radius: 5px;
            overflow-y: auto;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid #444;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: none;
        }

        .log-entry {
            margin-bottom: 4px;
            border-bottom: 1px solid #333;
            padding-bottom: 2px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-warn {
            color: #ff0;
        }

        .log-error {
            color: #f00;
            font-weight: bold;
        }

        .log-success {
            color: #0f0;
        }
    </style>
</head>

<body>
    <div id="debug-log">
        <div class="log-entry">Debug Log Panel Ready...</div>
    </div>

    <!-- 
        Targeting the NEXT-GEN iCn3D viewer (New Idea Baseline). 
    -->
    <iframe id="icn3d-frame" src="icn3d_next.html" style="display: block;"></iframe>

    <script src="dist/js/qwebchannel.js"></script>
    <script>
        // 1. Mission Critical: Define UI Logger Immediately
        const logEl = document.getElementById('debug-log');
        function logToUI(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry' + (type !== 'info' ? ' log-' + type : '');
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (logEl) {
                logEl.appendChild(entry);
                logEl.scrollTop = logEl.scrollHeight;
            }
        }

        logToUI("Wrapper initializing v2.1...");

        // 2. Gateway API: Exposed to Parent (index.html)
        // Must be defined at the TOP level to survive ReferenceErrors in other blocks
        window.loadPDBData = function (content) {
            logToUI("Gateway: Received PDB data. Size: " + (content ? content.length : "NULL"), 'success');
            const frame = document.getElementById('icn3d-frame');

            let attempts = 0;
            const tryLoad = () => {
                attempts++;
                if (frame && frame.contentWindow && typeof frame.contentWindow.loadLocalPDB === 'function') {
                    logToUI("Gateway: Inner IFrame ready. Transmitting payload...");
                    frame.contentWindow.loadLocalPDB(content);
                } else if (attempts < 30) {
                    if (attempts % 5 === 0) logToUI(`Gateway: Waiting for IFrame... (${attempts})`, 'warn');
                    setTimeout(tryLoad, 500);
                } else {
                    logToUI("Gateway Error: Inner IFrame failed to expose loadLocalPDB.", 'error');
                }
            };
            tryLoad();
        };

        // Standard compatibility
        window.loadFile = function (fileData, fileType) {
            if (fileType === 'structure') window.loadPDBData(fileData);
        };

        // 3. Communications Setup & Log Buffering
        const logBuffer = [];
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'icn3d-log') {
                const fullMsg = `[3D Process] ${event.data.msg}`;
                logToUI(event.data.msg, event.data.logType);

                // Forward PDB process to Python log (with buffering)
                if (window.py_bridge && typeof window.py_bridge.on_js_log === 'function') {
                    window.py_bridge.on_js_log(fullMsg);
                } else {
                    logBuffer.push(fullMsg);
                }
            }
        });

        // 4. Intercept Local Console
        try {
            const oldLog = console.log;
            console.log = function (...args) {
                oldLog.apply(console, args);
                logToUI(args.join(' '));
            };
            const oldWarn = console.warn;
            console.warn = function (...args) {
                oldWarn.apply(console, args);
                logToUI(args.join(' '), 'warn');
            }
        } catch (e) { }

        // 5. Safe QWebChannel (Python Bridge)
        const initBridge = () => {
            if (typeof qt !== "undefined" && qt.webChannelTransport) {
                try {
                    new QWebChannel(qt.webChannelTransport, function (channel) {
                        window.py_bridge = channel.objects.py_bridge;
                        logToUI("Local Python Bridge Connected.");

                        // Flush buffered logs
                        while (logBuffer.length > 0) {
                            const msg = logBuffer.shift();
                            window.py_bridge.on_js_log(msg);
                        }
                    });
                } catch (e) {
                    logToUI("Local Bridge init error: " + e.message, "error");
                }
            } else {
                logToUI("Note: No local Qt context. Using Parent Delegation mode.");
                // Retry if needed in some environments
                setTimeout(initBridge, 1000);
            }
        };
        initBridge();

    </script>
</body>

</html>
