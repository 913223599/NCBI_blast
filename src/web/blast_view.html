<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>BLAST Analysis Workbench</title>
    <link rel="stylesheet" href="css/blast_view.css">
    <script src="dist/js/qwebchannel.js"></script>
    <script src="js/ui_components.js"></script>
    <!-- Main Controller -->
    <script src="js/blast_view.js"></script>
</head>

<body>

    <div id="workbench" class="workbench">
        <!-- Floating History Tag -->
        <div class="history-tag" onclick="if(window.blastView) window.blastView.toggleHistory()">
            <svg class="icon-svg" viewBox="0 0 24 24">
                <polyline points="12 6 12 12 16 14"></polyline>
                <path
                    d="M2 13.24a9.67 9.67 0 0 0 2.71 5.83 10.2 10.2 0 0 0 14.32 0 9.89 9.89 0 0 0 0-14.14 10.2 10.2 0 0 0-13.52-.7C5.24 4.44 2.26 7.74 2 8">
                </path>
                <path d="M6 9H1V4"></path>
            </svg>
            <span data-i18n="blast_history">分析历史</span>
        </div>
        <!-- Input Panel -->
        <div id="editor-panel" class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--primary);">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    <span data-i18n="blast_input_seq">序列输入</span>
                </div>
            </div>
            <div class="panel-body">
                <div class="editor-zone">
                    <div class="input-mode-tabs">
                        <div id="tab-file" class="mode-tab active"
                            onclick="if(window.blastView) window.blastView.switchInputMode('file')">
                            <svg class="icon-svg" viewBox="0 0 24 24">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                                <line x1="12" y1="18" x2="12" y2="12"></line>
                                <line x1="9" y1="15" x2="15" y2="15"></line>
                            </svg>
                            <span data-i18n="blast_tab_file">批量文件 (File)</span>
                        </div>
                        <div id="tab-text" class="mode-tab"
                            onclick="if(window.blastView) window.blastView.switchInputMode('text')">
                            <svg class="icon-svg" viewBox="0 0 24 24">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                            <span data-i18n="blast_tab_text">文本粘贴 (Text)</span>
                        </div>
                    </div>

                    <!-- Mode: File (Default) -->
                    <div id="mode-file" class="mode-section active">
                        <div id="file-drop-area" class="drop-zone compact"
                            onclick="if(window.blastView) window.blastView.selectFiles()">
                            <svg class="icon-svg" viewBox="0 0 24 24"
                                style="width: 20px; height: 20px; color: var(--primary);">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span style="margin-left: 8px; font-weight: 500;"
                                data-i18n="blast_drop_zone">点击添加或拖拽文件到此处</span>
                        </div>

                        <div class="file-list-container">
                            <div class="file-list-header">
                                <div style="display:flex;align-items:center;gap:6px;">
                                    <span data-i18n="blast_file_list">待比对文件列表</span>
                                    <span id="file-count-badge" class="badge"
                                        style="background:var(--bg-page); color:var(--text-muted)">0</span>
                                </div>
                                <button class="btn-icon" title="清空列表" style="padding:4px;"
                                    onclick="if(window.blastView) window.blastView.clearFiles()">
                                    <svg class="icon-svg" viewBox="0 0 24 24"
                                        style="width:16px;height:16px;color:var(--text-muted);">
                                        <polyline points="3 6 5 6 21 6"></polyline>
                                        <path
                                            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                                        </path>
                                    </svg>
                                </button>
                            </div>
                            <div id="file-list-scroll" class="file-scroll-area">
                                <div class="file-list-empty" data-i18n="blast_empty_list">
                                    拖拽文件至上方区域<br>或者点击添加
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Mode: Text -->
                    <div id="mode-text" class="mode-section">
                        <textarea id="query-input" placeholder=">Sequence_Title&#10;ATCG..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Parameters Panel -->
        <div id="params-panel" class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--primary);">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    <span data-i18n="parameter_settings_title">参数配置</span>
                </div>
                <button id="run-btn" class="btn btn-primary" style="padding: 6px 12px; font-size: 0.8rem;"
                    onclick="if(window.blastView) window.blastView.launchBlast()">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width: 14px; height: 14px; margin-right: 4px;">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span data-i18n="blast_btn_run">开始分析</span>
                </button>
            </div>
            <div class="panel-body scroll-v">
                <div class="control-panel">
                    <div class="form-group">
                        <label data-i18n="param_program" data-i18n-help="help_program">分析程序 (Program)</label>
                        <select id="prog-select" class="settings-input"
                            onchange="if(window.blastView) window.blastView.updateDBOptions()">
                            <option value="auto" data-i18n="opt_auto">自动识别 (Auto)</option>
                            <option value="blastn" data-i18n="opt_blastn">blastn (核酸 -> 核酸)</option>
                            <option value="blastp" data-i18n="opt_blastp">blastp (蛋白 -> 蛋白)</option>
                            <option value="blastx" data-i18n="opt_blastx">blastx (核酸翻译 -> 蛋白)</option>
                            <option value="tblastn" data-i18n="opt_tblastn">tblastn (蛋白 -> 核酸翻译)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="param_database" data-i18n-help="help_database">目标数据库 (Database)</label>
                        <select id="db-select" class="settings-input"
                            onchange="if(window.blastView) window.blastView.saveParams()">
                            <option value="nt">nt - Nucleotide collection</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="param_evalue" data-i18n-help="help_evalue">E-Value 阈值</label>
                            <input type="number" id="evalue-input" class="settings-input" value="0.05" step="0.01"
                                onchange="if(window.blastView) window.blastView.saveParams()">
                        </div>
                        <div class="form-group">
                            <label data-i18n="param_hitlist" data-i18n-help="help_hits">最大匹配数</label>
                            <input type="number" id="hits-input" class="settings-input" value="50"
                                onchange="if(window.blastView) window.blastView.saveParams()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-i18n="param_matrix" data-i18n-help="help_matrix">计分矩阵 (Matrix)</label>
                        <select id="matrix-select" class="settings-input"
                            onchange="if(window.blastView) window.blastView.saveParams()">
                            <option value="BLOSUM62" data-i18n="mat_recommended">BLOSUM62 (推荐)</option>
                            <option value="BLOSUM45">BLOSUM45</option>
                            <option value="BLOSUM80">BLOSUM80</option>
                            <option value="PAM30">PAM30</option>
                            <option value="PAM70">PAM70</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label data-i18n="param_gap_open" data-i18n-help="help_gap">空隙开启 (Opening)</label>
                            <input type="number" id="gap-open" class="settings-input" value="11"
                                onchange="if(window.blastView) window.blastView.saveParams()">
                        </div>
                        <div class="form-group">
                            <label data-i18n="param_gap_extend" data-i18n-help="help_gap_extend">空隙延伸
                                (Extension)</label>
                            <input type="number" id="gap-extend" class="settings-input" value="1"
                                onchange="if(window.blastView) window.blastView.saveParams()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label data-i18n="param_threads" data-i18n-help="help_threads">并行处理线程数</label>
                        <input type="number" id="threads-input" class="settings-input" value="4" min="1" max="64"
                            onchange="if(window.blastView) window.blastView.saveParams()">
                        <div style="font-size: 0.72rem; color: var(--text-secondary); margin-top: 4px;"
                            data-i18n="param_threads_tip">
                            设置本地 CPU 核心调用数量，建议不要超过物理核心数
                        </div>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 8px; padding-top: 5px;">
                        <input type="checkbox" id="filter-check" checked style="width: auto; height: auto;"
                            onchange="if(window.blastView) window.blastView.saveParams()">
                        <label style="margin-bottom: 0;" data-i18n="param_filter" data-i18n-help="help_filter">过滤低复杂度区域
                            (Filter)</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Panel -->
        <div id="history-panel" class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--primary); margin-right: 6px;">
                        <polyline points="12 6 12 12 16 14"></polyline>
                        <path
                            d="M2 13.24a9.67 9.67 0 0 0 2.71 5.83 10.2 10.2 0 0 0 14.32 0 9.89 9.89 0 0 0 0-14.14 10.2 10.2 0 0 0-13.52-.7C5.24 4.44 2.26 7.74 2 8">
                        </path>
                        <path d="M6 9H1V4"></path>
                    </svg>
                    <span data-i18n="blast_history">分析历史</span>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="btn-danger-block" title="清除历史"
                        onclick="if(window.blastView) window.blastView.clearHistory()">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                    <!-- Auto-refresh active, manual refresh removed -->
                    <button class="btn-toggle-block" title="收起"
                        onclick="if(window.blastView) window.blastView.toggleHistory()">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="panel-body scroll-v">
                <div id="task-list" class="task-list">
                    <!-- Dynamic -->
                </div>
            </div>
        </div>

        <!-- Results Panel -->
        <div id="matrix-panel" class="panel">
            <div class="panel-header">
                <div class="panel-title">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="color: var(--primary); margin-right: 6px;">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    <span id="matrix-title" data-i18n="blast_results">结果矩阵</span>
                </div>
                <div class="header-actions" style="display: flex; align-items: center; gap: 15px;">
                    <div id="result-progress" style="width: 180px;" class="hidden">
                        <div style="background: #e2e8f0; height: 6px; border-radius: 3px; overflow: hidden;">
                            <div id="progress-bar"
                                style="background: var(--primary); width: 0%; height: 100%; transition: width 0.3s;">
                            </div>
                        </div>
                    </div>
                    <button class="btn btn-ghost" onclick="if(window.blastView) window.blastView.translateAllResults()"
                        data-i18n-title="tip_translate_all" title="翻译结果中的所有物种名">
                        <svg class="icon-svg" viewBox="0 0 24 24" style="margin-right: 6px; color: #f59e0b;">
                            <path d="M5 8l6 6"></path>
                            <path d="M4 14l6-6 2-3"></path>
                            <path d="M2 5h12"></path>
                            <path d="M7 2h1"></path>
                            <path d="M22 22l-5-10-5 10"></path>
                            <path d="M14 18h6"></path>
                        </svg>
                        <span data-i18n="btn_translate_all">一键 AI 翻译</span>
                    </button>
                    <button class="btn btn-ghost" onclick="if(window.blastView) window.blastView.exportResults()">
                        <svg class="icon-svg" viewBox="0 0 24 24" style="margin-right: 6px;">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span data-i18n="btn_export">导出报表</span>
                    </button>
                </div>
            </div>
            <div class="panel-body">
                <div class="table-container">
                    <table id="result-table">
                        <thead>
                            <tr>
                                <th style="width: 15%;" data-i18n="col_query">查询序列</th>
                                <th style="width: 20%;" data-i18n="col_hit">最匹配项 (鉴定详情)</th>
                                <th style="width: 22%;" data-i18n="col_desc">生物学背景</th>
                                <th style="width: 9%;" data-i18n="col_identity">相似度</th>
                                <th style="width: 12%;" data-i18n="col_evalue">E值</th>
                                <th style="width: 14%;" data-i18n="col_accession">登录号</th>
                                <th style="width: 8%;" data-i18n="col_action">操作</th>
                            </tr>
                        </thead>
                        <tbody id="result-body"></tbody>
                    </table>
                    <div id="empty-state" style="padding: 120px 20px; text-align: center; color: var(--text-muted);">
                        <svg class="icon-svg" viewBox="0 0 24 24"
                            style="width: 64px !important; height: 64px !important; opacity: 0.1; margin-bottom: 20px;">
                            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                        </svg>
                        <p style="font-weight: 500;">选择历史任务或提交新序列开始分析</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-overlay" class="detail-overlay" onclick="if(window.blastView) window.blastView.closeDetail()">
        <div class="detail-content" onclick="event.stopPropagation()">
            <div class="detail-header">
                <div>
                    <h2 id="detail-title" style="margin: 0; font-size: 1.25rem;">比对详情</h2>
                    <div id="detail-subtitle" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">--
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="if(window.blastView) window.blastView.triggerVisualizer()">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M12 20v-6M6 20V10M18 20V4" />
                        </svg>
                        图形化概览
                    </button>
                    <button class="btn-icon" onclick="if(window.blastView) window.blastView.closeDetail()"
                        style="padding: 10px; border: 1px solid var(--border); border-radius: 8px;">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>
            <div id="detail-body" class="detail-body">
                <!-- Hits will be rendered here -->
            </div>
            <!-- Dictionary Tab -->
            <div id="dict-tab" class="settings-content hidden">
                <div style="margin-bottom: 20px;">
                    <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-main);">翻译词典管理</h3>
                    <p style="margin: 5px 0 0 0; font-size: 0.85rem; color: var(--text-muted);">
                        搜索并修正生物学物种名称的中文翻译。修改后将自动更新到数据库。
                    </p>
                </div>

                <div class="dict-search-box" style="margin-bottom: 20px; position: relative;">


                    <input type="text" id="dict-search-input" placeholder="输入英文物种名进行搜索..."
                        style="width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem;">
                    <svg class="icon-svg" viewBox="0 0 24 24"
                        style="position: absolute; left: 10px; top: 10px; color: var(--text-muted);">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <button class="btn btn-primary" onclick="if(window.blastView) window.blastView.searchDict()"
                        style="position: absolute; right: 5px; top: 5px; padding: 4px 12px; font-size: 0.8rem;">
                        搜索
                    </button>
                </div>

                <div id="dict-results"
                    style="max-height: 400px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc;">
                    <div style="padding: 40px; text-align: center; color: var(--text-muted);">
                        <svg class="icon-svg" viewBox="0 0 24 24"
                            style="width: 48px; height: 48px; opacity: 0.2; margin-bottom: 10px;">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <p>输入关键词开始检索词典</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Translation Modal -->
        <div id="edit-trans-overlay" class="detail-overlay" style="z-index: 1200;">
            <div class="detail-content" style="max-width: 500px; height: auto;" onclick="event.stopPropagation()">
                <div class="detail-header">
                    <h2 style="margin: 0; font-size: 1.1rem;">修正翻译</h2>
                    <button class="btn-icon" onclick="if(window.blastView) window.blastView.closeEditTrans()">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <div style="padding: 20px;">
                    <div class="form-group">
                        <label>英文原文 (English)</label>
                        <input type="text" id="edit-source-text" readonly
                            style="background: #f1f5f9; color: var(--text-muted);">
                    </div>
                    <div class="form-group">
                        <label>中文译文 (Chinese)</label>
                        <input type="text" id="edit-target-text" placeholder="输入正确的中文翻译">
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                        <button class="btn btn-ghost"
                            onclick="if(window.blastView) window.blastView.closeEditTrans()">取消</button>
                        <button class="btn btn-primary"
                            onclick="if(window.blastView) window.blastView.saveTranslationEdit()">保存修改</button>
                    </div>
                </div>
            </div>
        </div>
</body>

</html>
