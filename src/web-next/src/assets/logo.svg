<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagonal background -->
  <path d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z" fill="none" stroke="url(#logo-grad)" stroke-width="4" />
  
  <!-- DNA Helix -->
  <g filter="url(#glow)">
    <path d="M35 30 Q50 40 65 30" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <path d="M35 45 Q50 55 65 45" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
    <path d="M35 60 Q50 70 65 60" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    <path d="M35 75 Q50 85 65 75" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    
    <!-- Vertical Strands -->
    <path d="M35 25 C35 25, 45 50, 35 75" fill="none" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />
    <path d="M65 25 C65 25, 55 50, 65 75" fill="none" stroke="url(#logo-grad)" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
