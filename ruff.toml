target-version = "py311"

[lint]
select = [
    "E4", "E7", "E9", "F",
    "B007", "B023", "B024", "B904",
    "C901",
    "PERF102",
    "RUF006", "RUF012",
    "S110", "S112", "S202", "S310", "S602",
    "SIM114",
]

[lint.mccabe]
# 阶梯式复杂度红线：已从 51 -> 40 -> 35 进一步压降至 25，全仓 27 个超限热点已拆解
max-complexity = 25

[lint.per-file-ignores]
"scripts/*.py" = ["E402", "C901", "S310", "RUF012", "B007", "SIM114", "PERF102"]
"scripts/**/*.py" = ["E402", "C901", "S310", "RUF012", "B007", "SIM114", "PERF102"]
"tests/*.py" = ["E402", "C901", "S310", "RUF012", "B007", "SIM114", "PERF102", "RUF006"]
"tests/**/*.py" = ["E402", "C901", "S310", "RUF012", "B007", "SIM114", "PERF102", "RUF006"]
